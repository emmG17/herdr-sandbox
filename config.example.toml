[runtime]
image = "localhost/herdr-codex-worker:latest"
network = "online"

[build]
# Used by the editable image/Containerfile boilerplate created by setup.
# Choose a Debian/Ubuntu-compatible image, or adapt that boilerplate for a
# different distribution and package manager.
base_image = "node:22-bookworm-slim"

[resources]
cpus = 4
memory = "8g"
pids = 1024

[gc]
# Workers older than this are GC candidates. Unfetched workers are fetched
# first and deleted only on success; otherwise they are skipped with a warning.
max_age = "7d"

[codex]
home = "codex"

# Interactive pane worker selection for start-codex/open when several workers exist.
# [open]
# id = "WORKER-001"

# [execute] is removed. Use: hs codex --prompt "..." (or execute --prompt as a thin alias).
