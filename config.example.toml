[runtime]
image = "localhost/herdr-codex-worker:latest"
network = "online"

[build]
# Used by the editable image/Containerfile boilerplate created by setup.
# Choose a Debian/Ubuntu-compatible image, or adapt that boilerplate for a
# different distribution and package manager.
base_image = "node:22-bookworm-slim"

[resources]
cpus = 4
memory = "8g"
pids = 1024

[gc]
# Workers older than this are GC candidates. Unfetched workers are fetched
# first and deleted only on success; otherwise they are skipped with a warning.
max_age = "7d"

# Experimental: optional CoW workspace materialization (RFC phase 5 / #14).
# Default remains "clone". "reflink" probes FICLONE (O_NOFOLLOW, no cp fallback)
# from the source filesystem into the plugin state directory; if that fails
# (cross-filesystem or no CoW), create falls back to clone with one notice and
# does not copy allowlisted paths. Tracked files always come from git objects;
# only copy_untracked paths are reflinked. Allowlist entries must be nonempty
# relative paths strictly under the source (no ".", "..", absolute, or .git
# segments). Symlink entries are rejected; absolute / escaping symlinks under a
# tree are skipped; hardlinks to non-allowlisted paths (e.g. .env) are skipped.
# Dirty trees are refused inside create_worker when strategy is reflink.
[workspace]
strategy = "clone"          # "clone" | "reflink" (experimental)
copy_untracked = []         # reflink only, e.g. ["node_modules", "target", ".venv"]

# Per-agent home under the plugin config directory. Default dirname matches the
# agent name when omitted. Never point this at a normal user agent home
# (~/.codex, ~/.claude) or other banned host paths (~/.claude.json).
[codex]
home = "codex"

[claude]
home = "claude"
# Explicit opt-in only: when true, pass --env ANTHROPIC_API_KEY with no value so
# Podman inherits it from the hs process environment (secret never on argv).
# Host env is never forwarded implicitly. Do not put the key in this file,
# the repo, or the image.
# forward_api_key = false

# Interactive pane worker selection for start-codex/open when several workers exist.
# [open]
# id = "WORKER-001"

# [execute] is removed. Use: hs codex --prompt "..." or hs claude --prompt "..."
# Authenticate with: hs login codex  or  hs login claude
