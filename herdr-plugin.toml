id = "dev.herdr.sandbox"
name = "Sandbox Workers"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Isolated Codex workers using rootless Podman"
platforms = ["linux"]

[[actions]]
id = "setup"
title = "Sandbox: Set Up"
description = "Create plugin configuration and a dedicated Codex home"
command = ["python3", "bin/herdr-sandbox", "setup"]

[[actions]]
id = "build-image"
title = "Sandbox: Build Image"
description = "Build the Codex worker image with rootless Podman"
command = ["python3", "bin/herdr-sandbox", "build-image"]

[[actions]]
id = "check"
title = "Sandbox: Check Readiness"
description = "Check host tools, image, and plugin-owned paths"
command = ["python3", "bin/herdr-sandbox", "check"]

[[actions]]
id = "create"
title = "Sandbox: Create Worker"
description = "Create an isolated worker clone from the current Git workspace"
command = ["python3", "bin/herdr-sandbox", "create"]

[[actions]]
id = "list"
title = "Sandbox: List Workers"
description = "List persisted workers and their current Git and container state"
command = ["python3", "bin/herdr-sandbox", "list"]

[[actions]]
id = "inspect"
title = "Sandbox: Inspect Worker"
description = "Inspect a worker's metadata, Git history, status, and base diff"
command = ["python3", "bin/herdr-sandbox", "inspect"]

[[actions]]
id = "destroy"
title = "Sandbox: Destroy Worker"
description = "Stop and remove a worker container and its disposable state"
command = ["python3", "bin/herdr-sandbox", "destroy"]

[[actions]]
id = "open"
title = "Sandbox: Open Worker"
description = "Open an interactive Podman session in a Herdr-managed pane"
command = ["python3", "bin/herdr-sandbox", "open"]
