id = "dev.herdr.sandbox"
name = "Sandbox Workers"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Isolated Codex and Claude Code workers using rootless Podman"
platforms = ["linux"]

[[actions]]
id = "setup"
title = "Sandbox: Set Up"
description = "Create plugin configuration and dedicated agent homes"
command = ["python3", "bin/herdr-sandbox", "setup"]

[[actions]]
id = "bootstrap"
title = "Sandbox: Bootstrap"
description = "Create plugin state and build the worker image for first use"
command = ["python3", "bin/herdr-sandbox", "bootstrap"]

[[actions]]
id = "build-image"
title = "Sandbox: Build Image"
description = "Build the sandbox worker image with rootless Podman"
command = ["python3", "bin/herdr-sandbox", "build-image"]

[[actions]]
id = "check"
title = "Sandbox: Check Readiness"
description = "Check host tools, image, and plugin-owned paths"
command = ["python3", "bin/herdr-sandbox", "check", "--execution"]

[[actions]]
id = "list"
title = "Sandbox: List Workers"
description = "List persisted workers (hs ls)"
command = ["python3", "bin/hs", "ls"]

[[actions]]
id = "inspect"
title = "Sandbox: Inspect Workers"
description = "List workers for the focused workspace (hs inspect; uses workspace_cwd from plugin context)"
command = ["python3", "bin/hs", "inspect"]

[[actions]]
id = "destroy"
title = "Sandbox: Garbage-Collect Workers"
description = "Alias of hs gc: remove fetched workers whose panes are gone, or workers older than [gc].max_age"
command = ["python3", "bin/hs", "gc"]

[[actions]]
id = "gc"
title = "Sandbox: Garbage-Collect Workers"
description = "Remove fetched workers whose panes are gone, or workers older than [gc].max_age (hs gc)"
command = ["python3", "bin/hs", "gc"]

[[panes]]
id = "start-codex"
title = "Sandbox: Start Codex"
placement = "overlay"
command = ["python3", "bin/hs", "codex"]

[[panes]]
id = "start-claude"
title = "Sandbox: Start Claude Code"
placement = "overlay"
command = ["python3", "bin/hs", "claude"]

[[events]]
on = "pane.closed"
command = ["python3", "bin/hs", "gc", "--from-event"]
